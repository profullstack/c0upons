name: db-keepalive

# Turso scales an idle free database to zero and wakes it automatically on the
# next request, but a group left idle for ten days is archived, and that state
# needs an explicit unarchive call. Keeping a query flowing means the ten-day
# clock never runs down.
#
# Two caveats worth knowing before trusting it as the sole guard:
#   * GitHub delays scheduled runs under load and drops them entirely when the
#     repo has had no activity for 60 days, so treat the cadence as best-effort.
#   * It probes through the deployed site, so a Railway outage shows up here as
#     a failure too. That is deliberate — both mean c0upons is down.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          BASE_URL: ${{ vars.KEEPALIVE_BASE_URL || 'https://c0upons.com' }}
        run: |
          set -uo pipefail
          # Retry a couple of times so one dropped request doesn't page anyone;
          # a genuinely paused node fails all three the same way.
          for attempt in 1 2 3; do
            status=$(curl -fsS -m 30 -o body.txt -w '%{http_code}' \
              "$BASE_URL/api/health/db" || echo 000)
            if [ "$status" = "200" ]; then
              echo "database awake (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $status"
            cat body.txt || true
            sleep 10
          done
          echo "::error::Database unreachable after 3 attempts (last status $status)."
          echo "::error::If the group was archived for inactivity, unarchive it:"
          echo "::error::  turso group unarchive default   (or POST /v1/organizations/{org}/groups/{group}/unarchive)"
          exit 1
      # The same schedule is what fills the site: each tick pulls the next
      # pages of nichedb.dev's deals collection into stores and coupons. The
      # route throttles itself to one run per ten minutes and answers
      # `skipped` otherwise, so calling it every fifteen is the cadence. A
      # failed sync is logged, not fatal: the job's verdict is the database.
      - name: Sync deals from nichedb.dev
        env:
          BASE_URL: ${{ vars.KEEPALIVE_BASE_URL || 'https://c0upons.com' }}
        run: |
          set -uo pipefail
          status=$(curl -sS -m 60 -X POST -o sync.json -w '%{http_code}' \
            "$BASE_URL/api/sync/nichedb" || echo 000)
          echo "sync: HTTP $status"
          cat sync.json || true
          echo
          if [ "$status" != "200" ]; then
            echo "::warning::nichedb sync answered HTTP $status"
          fi
      # And the coupons that arrived without a code get their deal pages read
      # by the browser, three per tick, most-voted first.
      - name: Reveal hidden codes
        env:
          BASE_URL: ${{ vars.KEEPALIVE_BASE_URL || 'https://c0upons.com' }}
        run: |
          set -uo pipefail
          status=$(curl -sS -m 180 -X POST -o reveal.json -w '%{http_code}' \
            "$BASE_URL/api/sync/reveal" || echo 000)
          echo "reveal: HTTP $status"
          cat reveal.json || true
          echo
          if [ "$status" != "200" ]; then
            echo "::warning::reveal sweep answered HTTP $status"
          fi
